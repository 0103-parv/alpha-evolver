<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cordi Lab — Photocard Accessories</title>
<meta name="description" content="Collectible blind box accessories designed to keep your photo cards front-facing.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=6">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="icon" href="img/favicon.png" type="image/png" sizes="64x64">
<link rel="apple-touch-icon" href="img/favicon-180.png">
</head>
<body>

<header class="site-header">
  <a class="brand" href="#/">Cordi <span>Lab</span></a>
  <nav class="site-nav" aria-label="Main navigation">
    <a href="#/" data-nav="home">Home</a>
    <a href="#/our-story" data-nav="our-story">Our Story</a>
    <a href="#/collections" data-nav="collections">Collections</a>
  </nav>
  <div class="header-icons">
  <a class="cart-button" id="account-button" href="#/account" aria-label="Your account">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="8" r="4"/>
      <path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/>
    </svg>
  </a>
  <button class="cart-button" id="cart-button" aria-label="Open cart">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M6 7h12l-1.2 12.2a2 2 0 0 1-2 1.8H9.2a2 2 0 0 1-2-1.8L6 7z"/>
      <path d="M9 9V6a3 3 0 0 1 6 0v3"/>
    </svg>
    <span class="cart-count" id="cart-count" hidden>0</span>
  </button>
  </div>
</header>

<main id="app" tabindex="-1"></main>

<footer class="site-footer">
  <div class="footer-inner">
    <div>
      <p class="footer-brand">Cordi <span>Lab</span></p>
      <p class="footer-tag">Keeping your favorite moments front-facing, always.</p>
    </div>
    <nav class="footer-nav" aria-label="Footer navigation">
      <a href="#/">Home</a>
      <a href="#/our-story">Our Story</a>
      <a href="#/collections">Collections</a>
    </nav>
  </div>
  <p class="footer-note">&copy; 2026 Cordi Lab. Demo storefront, payments are simulated.</p>
</footer>

<!-- Cart drawer -->
<div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
<aside class="cart-drawer" id="cart-drawer" aria-label="Shopping cart" aria-hidden="true">
  <div class="cart-drawer-head">
    <h2>Your Cart</h2>
    <button class="icon-button" id="cart-close" aria-label="Close cart">&times;</button>
  </div>
  <div class="cart-items" id="cart-items"></div>
  <div class="cart-drawer-foot" id="cart-foot"></div>
</aside>

<!-- Mascot -->
<div class="mascot" id="mascot">
  <div class="coco-chat" id="coco-chat" role="dialog" aria-label="Chat with Coco" hidden>
    <div class="coco-chat-head">
      <span class="coco-chat-title">Coco <em>the Cordi bunny</em></span>
      <button class="icon-button" id="coco-chat-close" aria-label="Close chat">&times;</button>
    </div>
    <div class="coco-chat-messages" id="coco-chat-messages" aria-live="polite"></div>
    <div class="coco-chat-chips" id="coco-chat-chips"></div>
    <form class="coco-chat-inputrow" id="coco-chat-form">
      <input id="coco-chat-input" type="text" placeholder="Ask Coco anything…" autocomplete="off" maxlength="200">
      <button type="submit" class="coco-chat-send" aria-label="Send message">➤</button>
    </form>
  </div>
  <div class="mascot-bubble" id="mascot-bubble" hidden></div>
  <button class="mascot-stage" id="mascot-stage" aria-label="Chat with Coco, the Cordi Lab mascot"></button>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="app.js?v=6"></script>
</body>
</html>
